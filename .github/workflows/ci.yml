name: CI

on:
  push:
    branches: [ main, theme-foundation ]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Install coding standards
        run: composer install --no-interaction --no-progress
      - name: WordPress Coding Standards
        if: matrix.php == '8.3'
        run: vendor/bin/phpcs --standard=phpcs.xml.dist
      - name: JSON files are valid
        run: for f in theme.json styles/*.json bundled-demos/*/demo.json bundled-demos/*/*/content.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: JavaScript syntax
        run: for f in assets/js/*.js; do node --check "$f" || exit 1; done
