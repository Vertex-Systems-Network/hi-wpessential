name: Full Kit Integration

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'core/kit/**'
      - 'core/src/Kit.php'
      - 'core/src/Kit/Elements/**'
      - 'core/assets/kit-editor.js'
      - 'tools/tests/**'
      - '.github/workflows/kit-integration.yml'

jobs:
  wordpress:
    name: WordPress + Gutenberg + Elementor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wpe_smoke
          MYSQL_USER: wpe
          MYSQL_PASSWORD: wpe
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, gd, zip
      - name: Code JavaScript syntax
        run: node --check core/kit/code/script.js
      - name: All Kit JavaScript interaction tests
        run: |
          set -euo pipefail
          node --check core/assets/kit-editor.js
          for f in core/kit/*/script.js; do node --check "$f"; done
          for f in             tools/tests/counter-animation.cjs             tools/tests/gallery-lightbox.cjs             tools/tests/container-editor.cjs             tools/tests/video-embed.cjs             tools/tests/progress-bar-animation.cjs             tools/tests/code-copy.cjs             tools/tests/table-interactions.cjs             tools/tests/tooltip-interactions.cjs             tools/tests/kit-batch-22-26-interactions.cjs             tools/tests/kit-batch-27-28-30-interactions.cjs             tools/tests/kit-map-interactions.cjs             tools/tests/kit-social-feed-interactions.cjs             tools/tests/kit-batch-37-40-44-45-interactions.cjs; do
            node "$f"
          done
      - name: Install WP-CLI
        run: |
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          wp --info
      - name: Install WordPress and Elementor on temporary test site
        env:
          WP_DIR: ${{ runner.temp }}/wpe-wordpress
        run: |
          mkdir -p "$WP_DIR"
          wp core download --path="$WP_DIR" --quiet
          wp config create --path="$WP_DIR" --dbname=wpe_smoke --dbuser=wpe --dbpass=wpe --dbhost=127.0.0.1:3306 --quiet
          wp core install --path="$WP_DIR" --url=http://localhost:8090 --title="WPE Smoke" --admin_user=testadmin --admin_password=testpassword --admin_email=test@example.test --skip-email --quiet
          ln -s "$GITHUB_WORKSPACE" "$WP_DIR/wp-content/themes/hi-wpessential"
          wp theme activate hi-wpessential --path="$WP_DIR"
          wp plugin install elementor --activate --path="$WP_DIR" --quiet
          wp plugin is-active elementor --path="$WP_DIR"
      - name: Run all Kit WordPress smoke tests
        env:
          WP_DIR: ${{ runner.temp }}/wpe-wordpress
        run: |
          set -euo pipefail
          for test in posts-grid testimonial counter gallery container video progress-bar code table tooltip; do
            echo "=== Smoke: $test ==="
            wp eval-file "$GITHUB_WORKSPACE/tools/tests/$test-smoke.php" --path="$WP_DIR"
          done
          wp eval-file "$GITHUB_WORKSPACE/tools/tests/kit-batch-22-26-smoke.php" --path="$WP_DIR"
          wp eval-file "$GITHUB_WORKSPACE/tools/tests/kit-batch-27-28-30-smoke.php" --path="$WP_DIR"
          wp eval-file "$GITHUB_WORKSPACE/tools/tests/kit-batch-map-social-smoke.php" --path="$WP_DIR"
          wp eval-file "$GITHUB_WORKSPACE/tools/tests/kit-batch-32-34-35-36-smoke.php" --path="$WP_DIR"
          wp eval-file "$GITHUB_WORKSPACE/tools/tests/kit-batch-37-40-44-45-smoke.php" --path="$WP_DIR"
          wp eval-file "$GITHUB_WORKSPACE/tools/tests/kit-six-elements-smoke.php" --path="$WP_DIR"
      - name: Install WooCommerce and exercise real product CRUD
        env:
          WP_DIR: ${{ runner.temp }}/wpe-wordpress
        run: |
          set -euo pipefail
          wp plugin install woocommerce --activate --path="$WP_DIR" --quiet
          wp plugin is-active woocommerce --path="$WP_DIR"
          wp eval-file "$GITHUB_WORKSPACE/tools/tests/kit-products-woocommerce-smoke.php" --path="$WP_DIR"
