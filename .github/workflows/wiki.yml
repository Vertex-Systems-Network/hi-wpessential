name: Publish wiki

# Copies docs/wiki (pages and images) to the repository wiki whenever it changes on main.
# The wiki must be switched on in the repository settings and have at least one page.
on:
  push:
    branches: [ main ]
    paths: [ 'docs/wiki/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Push docs/wiki to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki || { echo "::warning::Wiki not found. Turn it on in Settings and create one page first."; exit 0; }
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Wiki up to date." && exit 0
          git commit -m "Docs from ${GITHUB_SHA::7}"
          git push
